<template>
    <lightning-card title="Project Info" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <template lwc:if={projectDetails}>
                <p class="slds-text-body_regular"><strong>Name:</strong> {projectDetails.name}</p>
                <p class="slds-text-body_regular"><strong>Description:</strong> {projectDetails.description}</p>
                <p class="slds-text-body_regular"><strong>
                    Default Branch: <span class="text-success">{projectDetails.default_branch}</span>
                </strong></p>
                <p class="slds-text-body_regular"><strong>Web URL: </strong><a href={projectDetails.web_url} target="_blank" rel="noopener noreferrer">
                    {projectDetails.web_url}
                </a></p>

                <p class="slds-text-body_regular"><strong>Owner Name:</strong> {projectDetails.owner.name}</p>
                <p class="slds-text-body_regular"><strong>Owner Email:</strong> {projectDetails.owner.public_email}</p>

                <p class="slds-text-body_regular"><strong>Created At: </strong>
                    <lightning-formatted-date-time
                        value={projectDetails.created_at}
                        day="2-digit"
                        month="2-digit"
                        year="numeric"
                    ></lightning-formatted-date-time>
                </p>
            </template>

            <template lwc:elseif={errorMessage}>
                <p class="slds-text-color_error">{errorMessage}</p>
            </template>

            <template lwc:else>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
