<template>
    <section class="clouds-section" aria-labelledby="clouds-heading">
        <h2 id="clouds-heading" class="section-title">{titleLabel}</h2>
        <div class="cards-grid">
            <template for:each={clouds} for:item="cloud">
                <div key={cloud.id} class="cloud-card" role="article">
                    <lightning-icon
                        icon-name={cloud.iconName}
                        size="large"
                        alternative-text={cloud.title}
                    ></lightning-icon>
                    <h3>{cloud.title}</h3>
                    <p>{cloud.description}</p>
                </div>
            </template>
        </div>
    </section>
</template>
