<template>
    <lightning-card title="Account Details" icon-name="standard:account">
        <div class="slds-p-horizontal_small">
            <template lwc:if={isDataLoaded}>
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="6" padding="around-small">
                        <lightning-input
                            type="text"
                            label="Account Name"
                            name="accountName"
                            value={accountData.Name}
                            onchange={handleInputChange}
                            data-field="Name">
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="around-small">
                        <lightning-combobox
                            label="Account Type"
                            name="accountType"
                            value={accountData.Type}
                            options={accountTypes}
                            onchange={handleInputChange}
                            data-field="Type">
                        </lightning-combobox>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input
                            type="text"
                            label="Account Number"
                            name="accountNumber"
                            value={accountData.AccountNumber}
                            disabled>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="6" padding="horizontal-small">
                        <lightning-input
                            label="Created Date"
                            value={accountData.CreatedDate}
                            disabled>
                        </lightning-input>
                    </lightning-layout-item>

                    <lightning-layout-item size="12" padding="around-small">
                        <lightning-input
                            type="text"
                            label="Account Site"
                            name="accountSite"
                            value={accountData.Site}
                            onchange={handleInputChange}
                            data-field="Site">
                        </lightning-input>
                    </lightning-layout-item>
                </lightning-layout>

                <lightning-layout class="slds-m-top_large" horizontal-align="spread">
                    <lightning-layout-item padding="horizontal-small">
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSave}
                            disabled={blockSaveButton}>
                        </lightning-button>
                    </lightning-layout-item>

                    <lightning-layout-item padding="horizontal-small">
                        <lightning-button
                            label="View record"
                            variant="neutral"
                            onclick={handleViewRecord}>
                        </lightning-button>
                    </lightning-layout-item>
                </lightning-layout>

                <div class="slds-m-top_large slds-text-heading_medium slds-p-horizontal_medium">
                    <strong>Related Contacts</strong>
                </div>

                <template lwc:if={isNumberOfUpdatedContactsPositive}>
                    <p class="slds-text-body_regular slds-m-top_small">
                        {numberOfUpdatedContacts} contact(s) were updated.
                    </p>
                </template>

                <lightning-layout multiple-rows>
                    <template for:each={contactRecords} for:item="contact">
                        <lightning-layout-item size="4" padding="around-small" key={contact.Id}>
                            <c-contact-info record={contact} oncontactupdated={handleContactUpdate}></c-contact-info>
                        </lightning-layout-item>
                    </template>
                </lightning-layout>
            </template>

            <template lwc:elseif={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>

            <template lwc:else>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
