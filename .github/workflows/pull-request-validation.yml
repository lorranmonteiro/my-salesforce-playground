name: PR Validation

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

env:
  SF_USE_GENERIC_UNIX_KEYCHAIN: true
  SF_IMPROVED_CODE_COVERAGE: true
  SF_HIDE_RELEASE_NOTES: true
  SF_DISABLE_TELEMETRY: true
  SF_CONTAINER_MODE: true
  SF_DISABLE_AUTOUPDATE: true
  SF_LOG_LEVEL: warn

jobs:
  run-code-analyzer:
    name: Run Code Analyzer
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Code Analyzer Plugin
        run: |
          if ! sf plugins | grep -q code-analyzer; then
            sf plugins install code-analyzer@latest
          fi

      - name: Run Code Analysis
        run: |
          sf code-analyzer run \
            --workspace ./force-app/main \
            --workspace ./force-app/utils/shared \
            --rule-selector Recommended \
            --rule-selector sfge \
            --severity-threshold 3 \
            --config-file config/code-analyzer.yml \
            --view detail

  lwc-jest-tests:
    name: LWC Jest Tests
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run LWC Jest Tests
        run: npm run test:unit:coverage

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwc-coverage
          path: coverage/

  validate-deploy-scratch-org:
    name: Validate Deploy with Scratch Org
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-full
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate Dev Hub
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

          sf org login jwt \
            --username ${{ secrets.SF_USERNAME }} \
            --client-id ${{ secrets.SF_CONSUMER_KEY }} \
            --jwt-key-file server.key \
            --instance-url https://login.salesforce.com \
            --alias Playground \
            --set-default

      - name: Create Scratch Org, Deploy, and Test
        run: |
          trap 'sf org delete scratch --target-org ScratchOrg --no-prompt || true' EXIT

          echo "Creating a scratch org..."
          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias ScratchOrg \
            --target-dev-hub Playground \
            --no-track-source \
            --duration-days 1 \
            --wait 10

          echo "Deploying source code and running tests..."
          sf project deploy start \
            --target-org ScratchOrg \
            --test-level RunLocalTests \
            --wait 15
